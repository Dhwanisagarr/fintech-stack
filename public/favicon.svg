<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="12"/>

  <!-- Emerald Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.15" filter="blur(30px)"/>

  <!-- Main Sparkle Symbol -->
  <path d="M 256,104 C 256,188 188,256 104,256 C 188,256 256,324 256,408 C 256,324 324,256 408,256 C 324,256 256,188 256,104 Z" fill="url(#sparkleGrad)"/>

  <!-- Secondary Accent Sparkle (Top-Right) -->
  <path d="M 376,96 C 376,128 352,152 320,152 C 352,152 376,176 376,208 C 376,176 400,152 432,152 C 400,152 376,128 376,96 Z" fill="url(#accentGrad)"/>
</svg>
